[project]
name = "todo-cli"
version = "0.1.0"
description = "一个极简 todo 命令行工具——也是三种 AI 开发 Workflow（Spec Kit / Ralph Loop / 多 Agent 编排）的实战演示项目"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Evan-bunny" }]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
todo = "todo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["todo"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
